composeMultiplatform = "1.11.1"
junit = "4.13.2"
kotlin = "2.4.10"
material3 = "1.11.0-alpha07"

ktor = "3.5.2"
koin = "4.2.2"
room = "2.8.4"
sqlite = "2.7.0"
serialization = "1.11.0"
coroutines = "1.11.0"
navigation-compose = "2.9.8"
coil = "3.5.0"
mockk = "1.14.11"
ksp = "2.3.11"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
